<html lang="en-MY">
<head>
<meta charset="utf-8">

<title>Budget Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23B48CFF'/%3E%3Cstop offset='.45' stop-color='%237C4BDB'/%3E%3Cstop offset='1' stop-color='%234A2296'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='41' text-anchor='middle' font-family='-apple-system,Segoe UI,Arial' font-weight='700' font-size='24' fill='%23F5DFA3'%3ERM%3C/text%3E%3C/svg%3E">
<style>
/* ===== Tokens: Purple Gold Glass Style ===== */
:root {
  --bg: #110820; --bg-2: #1A0D31; --wall-top: #24113F; --wall-floor: #0D0618;
  --text-1: #F7F3FF; --text-2: rgba(242,236,255,.88); --text-3: rgba(238,231,255,.70);
  --separator: rgba(255,255,255,.10);
  --glass-stroke: rgba(255,255,255,.14); --glass-top: rgba(255,255,255,.115); --glass-bottom: rgba(255,255,255,.045); --glass-tint: rgba(18,9,34,.42);
  --violet: #8F5CF0; --violet-light: #B48CFF; --violet-mid: #7C4BDB; --violet-deep: #4A2296;
  --gold: #E4C27A; --gold-light: #F5DFA3; --gold-pale: #FBEFC6; --gold-deep: #B8862E; --gold-ink: #2A1A05;
  --danger: #FF8A8A; /* functional: over-budget and overdue only */
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI Variable", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --space-1: 6px; --space-2: 10px; --space-3: 14px; --space-4: 20px; --space-5: 28px; --space-6: 48px;
  --radius-chip: 10px; --radius-icon: 15px; --radius-control: 14px; --radius-card: 22px; --radius-panel: 28px; --radius-hero: 36px; --radius-pill: 999px;
  --shadow-glass: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(255,255,255,.04), 0 30px 60px -30px rgba(0,0,0,.7), 0 10px 24px -12px rgba(0,0,0,.45);
  --shadow-gold: inset 0 1px 0 rgba(255,255,255,.6), 0 12px 28px -12px rgba(228,194,122,.8);
  --shadow-icon: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -2px 0 rgba(0,0,0,.2), 0 10px 22px -10px rgba(91,45,176,.9);
  --blur-glass: blur(30px) saturate(175%); --blur-sheet: blur(36px) saturate(170%);
  --opacity-glow: .40;
  --g-gold: linear-gradient(135deg, #FBEFC6 0%, #E3BF6A 38%, #B8862E 72%, #EFD38E 100%);
  --g-icon: linear-gradient(145deg, #B48CFF 0%, #7C4BDB 45%, #4A2296 100%);
  --spring: cubic-bezier(.32,.72,0,1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100dvh; background: var(--bg); color: var(--text-1);
  font-family: var(--font-sans); font-size: 16.5px; line-height: 1.55; letter-spacing: -.011em;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; overflow-x: hidden;
}
button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }
svg.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }

/* ===== Living wallpaper ===== */
.wall { position: fixed; inset: 0; z-index: -2; overflow: hidden;
  background: radial-gradient(120% 90% at 50% 0%, var(--wall-top) 0%, var(--bg) 55%, var(--wall-floor) 100%); }
.orb { position: absolute; border-radius: 50%; filter: blur(80px); will-change: transform; animation: drift 40s ease-in-out infinite alternate; }
.orb.o1 { width: 62vmax; height: 62vmax; left: -22vmax; top: -24vmax; background: rgba(124,75,219,.75); animation-duration: 38s; }
.orb.o2 { width: 46vmax; height: 46vmax; right: -20vmax; top: 18vh; background: rgba(196,150,62,.42); animation-duration: 44s; animation-delay: -8s; }
.orb.o3 { width: 56vmax; height: 56vmax; left: 10vw; bottom: -30vmax; background: rgba(150,70,190,.55); animation-duration: 46s; animation-delay: -16s; }
.orb.o4 { width: 30vmax; height: 30vmax; left: -8vmax; bottom: 8vh; background: rgba(228,194,122,.25); animation-duration: 34s; animation-delay: -4s; }
@keyframes drift { 0% { transform: translate3d(0,0,0) scale(1) } 50% { transform: translate3d(6vmax,4vmax,0) scale(1.08) } 100% { transform: translate3d(-4vmax,7vmax,0) scale(.95) } }
.noise { position: absolute; inset: 0; opacity: .06; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
#glow { position: fixed; left: 0; top: 0; width: 680px; height: 680px; margin: -340px 0 0 -340px; z-index: -1; pointer-events: none; border-radius: 50%; opacity: 0; transition: opacity .6s;
  background: radial-gradient(circle, rgba(143,92,240,var(--opacity-glow)) 0%, rgba(228,194,122,.10) 40%, transparent 68%); }
#glow.on { opacity: 1; }

/* ===== Glass ===== */
.glass {
  position: relative; isolation: isolate;
  background: linear-gradient(180deg, var(--glass-top), var(--glass-bottom)), var(--glass-tint);
  -webkit-backdrop-filter: var(--blur-glass); backdrop-filter: var(--blur-glass);
  border: 1px solid var(--glass-stroke); box-shadow: var(--shadow-glass); border-radius: var(--radius-panel);
}
.glass::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1; opacity: 0; transition: opacity .35s;
  background: radial-gradient(240px circle at var(--mx, -500px) var(--my, -500px), rgba(255,255,255,.08), transparent 65%); }
.fine .glass:hover::after { opacity: 1; }
.lift { transition: transform .45s var(--spring), border-color .45s var(--spring); }
.fine .lift:hover { transform: translateY(-3px); border-color: rgba(228,194,122,.35); }
.lift:active { transform: scale(.98); }

/* ===== Metallic type ===== */
.ms, .mp, .mg { -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; text-shadow: none;
  filter: drop-shadow(0 2px 5px rgba(8,3,18,.5)) drop-shadow(0 0 20px rgba(8,3,18,.3)); }
.ms { color: #fff; background-image: linear-gradient(175deg, #FFFFFF 0%, #F1ECF8 40%, #C9C0DA 70%, #F4F0FA 100%); }
.mp { color: var(--violet-light); background-image: linear-gradient(175deg, #FBF7FF 0%, #DCC6FF 30%, #A57BF2 58%, #7444D2 78%, #C6A6FF 100%); }
.mg { color: var(--gold); background-image: linear-gradient(175deg, #FFF8E1 0%, #F4DA98 32%, #D2A54C 60%, #A9782A 80%, #F0D594 100%); }

/* ===== App icon ===== */
.app { width: 52px; height: 52px; border-radius: var(--radius-icon); display: grid; place-items: center; color: var(--gold-light);
  background: var(--g-icon); box-shadow: var(--shadow-icon); flex: 0 0 auto; font-weight: 700; letter-spacing: -.03em; }
.app.sm { width: 36px; height: 36px; border-radius: var(--radius-chip); }
.app.sm svg.ic { width: 18px; height: 18px; }
.app.t-income { background: var(--g-gold); color: var(--gold-ink); box-shadow: var(--shadow-gold); }
.app.t-saving { background: linear-gradient(145deg, #DCC6FF 0%, #A57BF2 50%, #7444D2 100%); color: #fff; }

/* ===== Labels & motifs ===== */
.label { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; line-height: 1; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text-3); }
.dia { width: 7px; height: 7px; border-radius: 2px; background: var(--gold); transform: rotate(45deg); flex: 0 0 auto; }
.goldbar { display: block; width: 64px; height: 4px; border-radius: 4px; background: var(--g-gold); margin-top: 12px; transform-origin: left; }
.tab-tl, .tab-br { position: absolute; width: 58px; height: 3px; border-radius: 3px; background: var(--g-gold); }
.tab-tl { top: -1px; left: 26px; } .tab-br { bottom: -1px; right: 26px; }
.dots { position: absolute; right: 18px; top: 18px; width: 108px; height: 88px; opacity: .35; pointer-events: none;
  background-image: radial-gradient(circle, var(--gold) 1.6px, transparent 2px); background-size: 20px 20px; }

/* ===== Buttons ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 9px; height: 50px; padding: 0 24px; width: 100%;
  border-radius: var(--radius-pill); font-size: 16px; font-weight: 600; border: 0; transition: transform .35s var(--spring), opacity .2s; }
.btn:active { transform: scale(.96); }
.btn:disabled { opacity: .55; }
.btn.gold { color: var(--gold-ink); background: var(--g-gold); box-shadow: var(--shadow-gold); }
.btn.glassb { color: var(--text-1); background: rgba(255,255,255,.1); border: 1px solid var(--glass-stroke); box-shadow: inset 0 1px 0 rgba(255,255,255,.22); }
.btn.danger { background: none; color: var(--danger); height: 44px; }
.chip-btn { height: 32px; padding: 0 13px; border-radius: var(--radius-pill); border: 0; background: rgba(228,194,122,.18); color: var(--gold-light);
  font-size: 13.5px; font-weight: 600; transition: transform .35s var(--spring), background .2s; flex: 0 0 auto; }
.chip-btn:active { transform: scale(.94); background: rgba(228,194,122,.3); }
.icon-btn { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; border: 1px solid var(--glass-stroke);
  background: rgba(255,255,255,.08); box-shadow: inset 0 1px 0 rgba(255,255,255,.18); transition: transform .35s var(--spring); }
.icon-btn:active { transform: scale(.92); }
.icon-btn.spin svg { animation: spin .7s var(--spring); }
@keyframes spin { to { transform: rotate(360deg) } }

/* ===== Lock ===== */
#lock { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
.lock-card { width: 100%; max-width: 380px; padding: 36px 26px 26px; text-align: center; border-radius: var(--radius-hero); animation: rise .7s var(--spring) both; }
.lock-card .app { margin: 0 auto 18px; width: 64px; height: 64px; border-radius: 18px; font-size: 20px; }
.lock-card h1 { margin: 0 0 6px; font-size: 32px; line-height: 1.05; font-weight: 700; letter-spacing: -.04em; }
.lock-card p { margin: 0 0 22px; color: var(--text-2); font-size: 14.5px; }
.check { display: flex; align-items: center; gap: 10px; justify-content: center; font-size: 14px; color: var(--text-2); margin: 14px 0 18px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--gold); }
.err { color: var(--danger); font-size: 14px; min-height: 20px; margin-top: 12px; }
.err.shake { animation: shake .4s; }
@keyframes shake { 20%,60% { transform: translateX(-6px) } 40%,80% { transform: translateX(6px) } }

/* ===== Shell ===== */
#app { max-width: 560px; margin: 0 auto; padding: 0 16px calc(170px + env(safe-area-inset-bottom)); }
header.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: calc(12px + env(safe-area-inset-top)) 0 10px; }
header.top::before { content: ""; position: absolute; inset: 0 -16px; z-index: -1; pointer-events: none;
  background: linear-gradient(180deg, rgba(17,8,32,.85) 40%, rgba(17,8,32,0)); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  -webkit-mask-image: linear-gradient(180deg, #000 60%, transparent); mask-image: linear-gradient(180deg, #000 60%, transparent); }
.month { display: flex; align-items: center; gap: 6px; }
.month-label { border: 0; background: none; padding: 0 6px; min-width: 132px; text-align: center; font-size: 17px; font-weight: 600; letter-spacing: -.02em; }
.month-label span { display: inline-block; }
.month-label.swap-l span { animation: swapL .4s var(--spring); }
.month-label.swap-r span { animation: swapR .4s var(--spring); }
@keyframes swapL { from { transform: translateX(-16px); opacity: 0 } }
@keyframes swapR { from { transform: translateX(16px); opacity: 0 } }
.page-title { margin: 10px 2px 22px; font-size: 34px; line-height: 1.05; font-weight: 700; letter-spacing: -.04em; }
.page-title .t { display: inline-block; }
.loading-bar { position: fixed; top: 0; left: 0; height: 3px; width: 100%; z-index: 60; background: var(--g-gold); transform-origin: left; animation: load 1.1s var(--spring) infinite; }
@keyframes load { 0% { transform: scaleX(0); opacity: 1 } 70% { transform: scaleX(1); opacity: 1 } 100% { transform: scaleX(1); opacity: 0 } }

.demo-bar { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; margin-bottom: 16px; border-radius: 18px; font-size: 13.5px; line-height: 1.45; color: var(--text-2);
  background: linear-gradient(180deg, rgba(244,218,152,.16), rgba(184,134,46,.07)); border: 1px solid rgba(228,194,122,.28); }
.demo-bar b { color: var(--gold-light); font-weight: 600; }
.demo-bar .dia { margin-top: 6px; }

/* ===== Entry motion ===== */
@keyframes rise { from { opacity: 0; transform: translateY(24px) } to { opacity: 1; transform: none } }
@keyframes grow { from { transform: scaleX(0) } }
@keyframes ring { from { stroke-dashoffset: var(--c) } }
#view.enter > * { animation: rise .55s var(--spring) both; animation-delay: calc(var(--i, 0) * 55ms); }
#view.enter .bar i, #view.enter .goldbar { animation: grow .9s var(--spring) both; animation-delay: calc(var(--i, 0) * 55ms + 150ms); }
#view.enter .ring-fg { animation: ring 1.1s var(--spring) both; animation-delay: calc(var(--i, 0) * 55ms + 150ms); }

/* ===== Hero + widgets ===== */
.hero { padding: 26px 24px 22px; border-radius: var(--radius-hero); overflow: hidden; margin-bottom: 14px; }
.hero-num { display: block; margin: 16px 0 6px; font-size: 52px; line-height: 1; font-weight: 700; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
.hero-num.neg { -webkit-text-fill-color: var(--danger); color: var(--danger); background: none; filter: none; }
.hero-sub { margin: 0; color: var(--text-2); font-size: 14.5px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.widget { padding: 14px 12px 16px; border-radius: var(--radius-card); min-width: 0; }
.widget .label { font-size: 11px; gap: 6px; }
.widget .label .dia { width: 6px; height: 6px; }
.widget b { display: block; margin-top: 12px; font-size: clamp(13px, 3.9vw, 17px); font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.widget.goldw { background: linear-gradient(180deg, rgba(244,218,152,.22), rgba(184,134,46,.10)), var(--glass-tint); border-color: rgba(228,194,122,.35); }

/* ===== Sections & cards ===== */
.sec { display: flex; justify-content: space-between; align-items: flex-end; margin: 30px 4px 14px; }
.sec h2 { margin: 0; font-size: 20px; line-height: 1.2; font-weight: 700; letter-spacing: -.025em; }
.sec .cap { color: var(--text-3); font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; }
.card { padding: 18px 18px 20px; margin-bottom: 14px; border-radius: var(--radius-card); }
.card-row { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; border: 1px solid var(--glass-stroke); color: inherit; }
.card-row .main { flex: 1; min-width: 0; }
.card-row strong { display: block; font-size: 15.5px; font-weight: 600; line-height: 1.3; }
.sub { display: block; color: var(--text-2); font-size: 13.5px; line-height: 1.4; margin-top: 2px; }
.chev { color: var(--text-3); }
.empty { padding: 30px 22px; text-align: center; border-radius: var(--radius-panel); margin-bottom: 14px; }
.empty .app { margin: 0 auto 14px; }
.empty p { margin: 0; color: var(--text-2); font-size: 14.5px; }
.stack { display: grid; gap: 10px; margin-top: 6px; }

/* Grouped list */
.group-h { margin: 22px 0 8px 18px; font-size: 12.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text-3); }
ul.group { list-style: none; margin: 0 0 14px; padding: 0; border-radius: var(--radius-card); overflow: hidden; }
ul.group > li { position: relative; }
ul.group > li + li::before { content: ""; position: absolute; left: 66px; right: 0; top: 0; height: 1px; background: var(--separator); }
ul.group.plain > li + li::before { left: 18px; }
.row-btn { width: 100%; display: flex; align-items: center; gap: 14px; padding: 13px 16px; border: 0; background: none; text-align: left; transition: background .25s; }
.row-btn:active { background: rgba(255,255,255,.07); }
.fine .row-btn:hover { background: rgba(255,255,255,.04); }
.row-main { flex: 1; min-width: 0; }
.row-main strong { display: block; font-size: 15.5px; font-weight: 600; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-inline { display: flex; align-items: center; gap: 10px; padding-right: 14px; }
.row-inline .row-btn { flex: 1; min-width: 0; }
.amt { font-size: 15px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.amt.expense { color: var(--text-1); }
.amt.income { color: var(--gold-light); }
.amt.saving { color: var(--violet-light); }
.amt.trail { color: var(--gold-light); font-weight: 500; }
.amt.muted { color: var(--text-3); font-weight: 500; }
.over-text { color: var(--danger); }
.cat-row { padding: 15px 18px 16px; }
.cat-row .top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.cat-row strong { font-size: 15.5px; font-weight: 600; }

/* Bars */
.bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.09); overflow: hidden; margin-top: 10px; box-shadow: inset 0 1px 2px rgba(0,0,0,.3); }
.bar i { display: block; height: 100%; border-radius: 99px; transform-origin: left; background: linear-gradient(90deg, var(--violet-mid), var(--violet-light)); transition: width .6s var(--spring); }
.bar.warn i { background: var(--g-gold); }
.bar.over i { background: linear-gradient(90deg, #E25A6A, var(--danger)); }
.bar.goal i { background: var(--g-gold); }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: var(--radius-pill); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.pill.paid { background: rgba(228,194,122,.18); color: var(--gold-light); }
.pill.paid svg.ic { width: 14px; height: 14px; stroke-width: 2.4; }
.pill.due { background: rgba(143,92,240,.20); color: var(--violet-light); }
.pill.late { background: rgba(255,138,138,.16); color: var(--danger); }

/* Goals */
.goal { display: flex; gap: 16px; align-items: center; }
.ring { width: 64px; height: 64px; flex: 0 0 auto; position: relative; }
.ring svg { width: 64px; height: 64px; transform: rotate(-90deg); }
.ring-bg { stroke: rgba(255,255,255,.1); }
.ring-fg { stroke: url(#goldGrad); stroke-linecap: round; transition: stroke-dashoffset .8s var(--spring); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.goal-main { flex: 1; min-width: 0; }
.goal-main strong { display: block; font-size: 17px; font-weight: 700; letter-spacing: -.025em; }
.pace { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--separator); font-size: 13.5px; color: var(--text-2); display: flex; gap: 8px; align-items: center; }

/* ===== Floating tab bar + FAB ===== */
nav.tabs { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 10;
  width: min(528px, calc(100% - 24px)); padding: 6px; border-radius: 26px; }
nav.tabs .inner { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); }
.tab-ind { position: absolute; top: 0; bottom: 0; left: 0; width: 20%; border-radius: 20px; z-index: 0;
  background: rgba(255,255,255,.14); box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 4px 12px -4px rgba(0,0,0,.5);
  transform: translateX(calc(var(--idx, 0) * 100%)); transition: transform .5s var(--spring); }
nav.tabs button { position: relative; z-index: 1; border: 0; background: none; padding: 9px 0 7px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: 10.5px; font-weight: 600; color: var(--text-3); letter-spacing: 0; transition: color .3s, transform .35s var(--spring); }
nav.tabs button:active { transform: scale(.9); }
nav.tabs button svg.ic { width: 22px; height: 22px; }
nav.tabs button.on { color: var(--gold-light); }
.fab { position: fixed; z-index: 11; right: max(18px, calc(50% - 258px)); bottom: calc(96px + env(safe-area-inset-bottom));
  width: 60px; height: 60px; border-radius: 20px; border: 0; display: grid; place-items: center; color: var(--gold-ink);
  background: var(--g-gold); box-shadow: var(--shadow-gold), 0 18px 34px -14px rgba(0,0,0,.6); transition: transform .45s var(--spring); }
.fab svg.ic { width: 28px; height: 28px; stroke-width: 2.4; transition: transform .45s var(--spring); }
.fine .fab:hover svg.ic { transform: rotate(90deg); }
.fab:active { transform: scale(.9); }

/* ===== Bottom sheet ===== */
#sheetRoot .scrim { position: fixed; inset: 0; z-index: 20; background: rgba(8,3,18,.55); animation: fade .3s ease both; }
@keyframes fade { from { opacity: 0 } }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; margin: 0 auto; max-width: 560px; max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain;
  padding: 8px 18px calc(22px + env(safe-area-inset-bottom)); border-radius: var(--radius-panel) var(--radius-panel) 0 0; border-bottom: 0;
  background: linear-gradient(180deg, rgba(255,255,255,.13), rgba(255,255,255,.05)), rgba(26,13,49,.82);
  -webkit-backdrop-filter: var(--blur-sheet); backdrop-filter: var(--blur-sheet);
  animation: sheetUp .55s var(--spring) both; transition: transform .45s var(--spring); }
@keyframes sheetUp { from { transform: translateY(100%) } }
#sheetRoot.closing .scrim { opacity: 0; transition: opacity .3s; }
#sheetRoot.closing .sheet { transform: translateY(105%) !important; pointer-events: none; }
.sheet-head { touch-action: none; padding: 6px 0 2px; cursor: grab; }
.grip { width: 40px; height: 5px; border-radius: 99px; background: rgba(255,255,255,.28); margin: 0 auto 14px; }
.sheet h3 { margin: 0 0 18px; font-size: 24px; font-weight: 700; letter-spacing: -.03em; line-height: 1.15; }
.sheet > *:not(.sheet-head) { animation: rise .5s var(--spring) both; }
.sheet > :nth-child(3) { animation-delay: 40ms } .sheet > :nth-child(4) { animation-delay: 80ms } .sheet > :nth-child(5) { animation-delay: 120ms }
.sheet > :nth-child(6) { animation-delay: 160ms } .sheet > :nth-child(7) { animation-delay: 200ms }
.field { margin-bottom: 14px; }
.field label { display: block; margin: 0 0 7px 4px; font-size: 12.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text-3); }
.field input, .field select { width: 100%; height: 50px; padding: 0 16px; border-radius: 16px; border: 1px solid var(--glass-stroke);
  background: rgba(255,255,255,.07); box-shadow: inset 0 1px 0 rgba(255,255,255,.08); font-size: 16px; color: var(--text-1);
  transition: border-color .3s, box-shadow .3s, background .3s; -webkit-appearance: none; appearance: none; }
.field select { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23F5DFA3' stroke-width='2' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat: no-repeat; background-position: right 14px center; background-size: 18px; padding-right: 40px; }
.field select option { background: var(--bg-2); color: var(--text-1); }
.field input:focus, .field select:focus { outline: none; border-color: rgba(228,194,122,.6); background-color: rgba(255,255,255,.1); box-shadow: 0 0 0 4px rgba(228,194,122,.14); }
.field input::placeholder { color: var(--text-3); }
.field input[type=date]::-webkit-calendar-picker-indicator, .field input[type=month]::-webkit-calendar-picker-indicator { filter: invert(.9) sepia(.4) saturate(3) hue-rotate(5deg); }
.amount-wrap { position: relative; }
.amount-wrap span { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); font-size: 20px; font-weight: 600; color: var(--gold-light); }
.amount-input { height: 68px !important; padding-left: 58px !important; font-size: 32px !important; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions { display: grid; gap: 6px; margin-top: 8px; }

/* Segmented control with sliding thumb */
.seg { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 4px; margin-bottom: 18px;
  border-radius: var(--radius-control); background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1); }
.seg .thumb { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / var(--n, 3)); border-radius: var(--radius-chip);
  background: rgba(255,255,255,.2); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 4px 12px -4px rgba(0,0,0,.5);
  transform: translateX(calc(var(--idx, 0) * 100%)); transition: transform .45s var(--spring); }
.seg button { position: relative; z-index: 1; height: 36px; border: 0; background: none; border-radius: var(--radius-chip); color: var(--text-2); font-size: 14px; font-weight: 600; transition: color .3s; }
.seg button.on { color: var(--text-1); }

/* ===== HUD ===== */
.hud { position: fixed; left: 50%; top: 50%; z-index: 40; min-width: 156px; max-width: calc(100% - 64px); padding: 22px 22px 18px; border-radius: 24px;
  display: grid; justify-items: center; gap: 10px; text-align: center; font-size: 15px; font-weight: 600; color: var(--text-1);
  background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.05)), rgba(26,13,49,.8);
  -webkit-backdrop-filter: var(--blur-sheet); backdrop-filter: var(--blur-sheet); border: 1px solid var(--glass-stroke); box-shadow: var(--shadow-glass);
  opacity: 0; transform: translate(-50%, -50%) scale(.85); pointer-events: none; transition: opacity .25s, transform .45s var(--spring); }
.hud.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.hud .tick { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--g-gold); color: var(--gold-ink); box-shadow: var(--shadow-gold); }
.hud .tick svg.ic { width: 26px; height: 26px; stroke-width: 2.6; stroke-dasharray: 30; stroke-dashoffset: 30; }
.hud.show .tick svg.ic { animation: draw .45s .12s var(--spring) forwards; }
@keyframes draw { to { stroke-dashoffset: 0 } }
.hud.err-hud { color: var(--danger); }

/* ===== Reduced motion ===== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .hud .tick svg.ic { stroke-dashoffset: 0; }
}
</style>

<script>
/* ---------------- State ---------------- */
const state = { pin: null, month: thisMonth(), tab: 'overview', data: null, enter: true };
const TABS = ['overview', 'activity', 'bills', 'goals', 'settings'];
const TITLES = { overview: ['Money this', 'month'], activity: ['Where it', 'went'], bills: ['Bills to', 'clear'], goals: ['Saving', 'towards'], settings: ['Set your', 'limits'] };

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const REDUCED = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)').matches : false;
const FINE = window.matchMedia ? matchMedia('(hover: hover) and (pointer: fine)').matches : false;

/* ---------------- Icons ---------------- */
const I = {
  down: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg>',
  up: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  target: '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/></svg>',
  cal: '<svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  receipt: '<svg class="ic" viewBox="0 0 24 24"><path d="M5 3h14v18l-3.5-2-3.5 2-3.5-2L5 21z"/><path d="M9 8h6M9 12h6"/></svg>',
  list: '<svg class="ic" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  sliders: '<svg class="ic" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>',
  chev: '<svg class="ic chev" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>',
  check: '<svg class="ic" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  lock: '<svg class="ic" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
};

/* ---------------- Small utils ---------------- */
function pad(n) { return String(n).padStart(2, '0'); }
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function thisMonth() { return todayStr().slice(0, 7); }
function shiftMonth(m, by) {
  let [y, mo] = m.split('-').map(Number);
  mo += by; while (mo < 1) { mo += 12; y--; } while (mo > 12) { mo -= 12; y++; }
  return `${y}-${pad(mo)}`;
}
function daysIn(m) { const [y, mo] = m.split('-').map(Number); return new Date(y, mo, 0).getDate(); }
function monthName(m) {
  const [y, mo] = m.split('-').map(Number);
  return new Date(y, mo - 1, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
}
function dayLabel(d) {
  if (d === todayStr()) return 'Today';
  const [y, m, dd] = d.split('-').map(Number);
  return new Date(y, m - 1, dd).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
}
function rm(n) {
  const v = Number(n) || 0;
  return (v < 0 ? '−RM' : 'RM') + Math.abs(v).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function parseAmount(v) { return Number(String(v).replace(/,/g, '').trim()); }
function monthsBetween(fromM, toM) {
  const [y1, m1] = fromM.split('-').map(Number); const [y2, m2] = toM.split('-').map(Number);
  return (y2 - y1) * 12 + (m2 - m1) + 1; // inclusive of both months
}
function store(key, val) { try { val === null ? localStorage.removeItem(key) : localStorage.setItem(key, val); } catch (e) {} }
function recall(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
function buzz() { try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} }

/* ---------------- HUD ---------------- */
let toastTimer;
function toast(msg, ok = false) {
  const t = $('#toast');
  t.className = 'hud' + (ok ? '' : ' err-hud');
  t.innerHTML = (ok ? `<span class="tick">${I.check}</span>` : '') + `<span>${esc(msg)}</span>`;
  void t.offsetWidth; // restart animation
  t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ok ? 1100 : 2600);
}

/* ---------------- Demo mode (no API_URL yet) ----------------
   Saves to this browser only, so the app can be tried before Google Sheets is set up. */
const DEMO = !API_URL || API_URL.startsWith('PASTE_');
let demoMemory = null;
function demoDb() {
  if (demoMemory) return demoMemory;
  let db = null;
  try { db = JSON.parse(localStorage.getItem('bt_demo') || 'null'); } catch (e) {}
  if (!db) {
    db = { Transactions: [], Goals: [], Recurring: [], Categories: [] };
    [['Food & drinks', 'expense'], ['Transport & fuel', 'expense'], ['Rent & housing', 'expense'], ['Utilities', 'expense'],
     ['Phone & internet', 'expense'], ['Family', 'expense'], ['Education', 'expense'], ['Health', 'expense'],
     ['Subscriptions & fun', 'expense'], ['Personal', 'expense'], ['Other', 'expense'],
     ['Salary', 'income'], ['Side income', 'income'], ['Other income', 'income']]
      .forEach(([name, type], i) => db.Categories.push({ id: 'c' + i, name, type, budget: 0, active: true }));
  }
  return (demoMemory = db);
}
function demoPersist() { try { localStorage.setItem('bt_demo', JSON.stringify(demoMemory)); } catch (e) {} }
function demoApi(action, p) {
  const db = demoDb();
  const r2 = n => Math.round(n * 100) / 100;
  if (action === 'load') {
    const saved = {};
    db.Transactions.forEach(t => { if (t.type === 'saving') saved[t.goalId] = (saved[t.goalId] || 0) + t.amount; });
    return JSON.parse(JSON.stringify({
      month: p.month, categories: db.Categories, recurring: db.Recurring,
      goals: db.Goals.map(g => ({ ...g, saved: r2(saved[g.id] || 0) })),
      transactions: db.Transactions.filter(t => t.date.slice(0, 7) === p.month)
        .sort((a, b) => a.date !== b.date ? (a.date < b.date ? 1 : -1) : (a.createdAt < b.createdAt ? 1 : -1)),
    }));
  }
  const list = db[p.entity];
  if (!list) throw new Error('Unknown entity.');
  if (action === 'save') {
    const rec = { ...p.record };
    ['amount', 'budget', 'target', 'day'].forEach(k => { if (k in rec) rec[k] = r2(Number(rec[k]) || 0); });
    if ('name' in rec) { rec.name = String(rec.name).trim(); if (!rec.name) throw new Error('Name is required.'); }
    if (('amount' in rec && !(rec.amount > 0)) || (p.entity === 'Goals' && !(rec.target > 0))) throw new Error('Amount must be more than 0.');
    if (p.entity === 'Recurring' && !(rec.day >= 1 && rec.day <= 31)) throw new Error('Due day must be 1 to 31.');
    const i = rec.id ? list.findIndex(x => x.id === rec.id) : -1;
    if (i > -1) list[i] = { ...list[i], ...rec };
    else list.push({ ...rec, id: 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), createdAt: new Date().toISOString() });
    demoPersist(); return rec;
  }
  if (action === 'remove') {
    const i = list.findIndex(x => x.id === p.id);
    if (i > -1) list.splice(i, 1);
    demoPersist(); return { id: p.id };
  }
  throw new Error('Unknown action.');
}

/* ---------------- API ---------------- */
let inflight = 0;
async function api(action, payload = {}) {
  if (DEMO) return demoApi(action, payload);
  inflight++; $('#loading').classList.remove('hidden');
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids a CORS preflight
      body: JSON.stringify({ action, pin: state.pin, ...payload }),
    });
    const json = await res.json();
    if (!json.ok) {
      const err = new Error(json.error || 'Something went wrong.');
      err.auth = !!json.auth;
      throw err;
    }
    return json.data;
  } finally {
    inflight--; if (!inflight) $('#loading').classList.add('hidden');
  }
}

async function reload(enter = false) {
  try {
    state.data = await api('load', { month: state.month });
    state.enter = enter;
    render();
  } catch (e) { handleError(e); }
}

function handleError(e) {
  if (e.auth) { lock(e.message); return; }
  toast(e.message || 'Network error. Check your connection.');
}

/* ---------------- Lock / unlock ---------------- */
function lock(msg = '') {
  state.pin = null; state.data = null;
  if (msg === 'Wrong PIN.' || msg === 'No PIN set on the server yet.') store('bt_pin', null);
  closeSheet();
  ['#app', '#tabs', '#fab'].forEach(s => $(s).classList.add('hidden'));
  $('#lock').classList.remove('hidden');
  setLockErr(msg);
  $('#pinInput').value = '';
}
function setLockErr(msg) {
  const el = $('#lockErr'); el.textContent = msg;
  el.classList.remove('shake'); if (msg) { void el.offsetWidth; el.classList.add('shake'); }
}

async function unlock(pin, remember, silent = false) {
  state.pin = pin;
  $('#unlockBtn').disabled = true; setLockErr('');
  if (silent) $('#lock').classList.add('hidden');
  try {
    state.data = await api('load', { month: state.month });
    store('bt_pin', remember ? pin : null);
    $('#lock').classList.add('hidden');
    ['#app', '#tabs', '#fab'].forEach(s => $(s).classList.remove('hidden'));
    state.enter = true;
    render();
  } catch (e) {
    state.pin = null;
    if (silent) { $('#lock').classList.remove('hidden'); if (!e.auth) setLockErr(e.message); $('#pinInput').focus(); }
    else setLockErr(e.message);
    if (e.auth) store('bt_pin', null);
  } finally {
    $('#unlockBtn').disabled = false;
  }
}

/* ---------------- Derived numbers ---------------- */
function cat(id) { return state.data.categories.find(c => c.id === id); }
function goal(id) { return state.data.goals.find(g => g.id === id); }
function catName(id) { const c = cat(id); return c ? c.name : 'Unknown'; }

function totals() {
  const tx = state.data.transactions;
  const sum = type => tx.filter(t => t.type === type).reduce((a, t) => a + t.amount, 0);
  const income = sum('income'), spent = sum('expense'), saved = sum('saving');
  const byCat = {};
  tx.filter(t => t.type === 'expense').forEach(t => { byCat[t.category] = (byCat[t.category] || 0) + t.amount; });
  return { income, spent, saved, balance: income - spent - saved, byCat };
}

function billStatus(b) {
  const paid = state.data.transactions.find(t => t.recurringId === b.id);
  if (paid) return { key: 'paid', label: 'Paid', tx: paid };
  const due = Math.min(b.day, daysIn(state.month));
  const now = thisMonth();
  const late = state.month < now || (state.month === now && new Date().getDate() > due);
  return late ? { key: 'late', label: 'Overdue' } : { key: 'due', label: `Due ${due}${ordinal(due)}` };
}
function ordinal(n) { if (n % 100 >= 11 && n % 100 <= 13) return 'th'; return { 1: 'st', 2: 'nd', 3: 'rd' }[n % 10] || 'th'; }

/* ---------------- Rendering ---------------- */
function render() {
  if (!state.data) return;
  $('#monthLabel span').textContent = monthName(state.month);
  const idx = TABS.indexOf(state.tab);
  $$('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
  $('#tabInd').style.setProperty('--idx', idx);
  $('#demoBar').classList.toggle('hidden', !DEMO || state.tab !== 'overview');
  const [a, b] = TITLES[state.tab];
  $('#pageTitle').innerHTML = `<span class="t ms">${a}</span> <span class="t mg">${b}</span><span class="goldbar"></span>`;

  const views = { overview: viewOverview, activity: viewActivity, bills: viewBills, goals: viewGoals, settings: viewSettings };
  const view = $('#view');
  view.classList.remove('enter');
  view.innerHTML = views[state.tab]();
  if (state.enter && !REDUCED) {
    [...view.children].forEach((el, i) => el.style.setProperty('--i', i));
    void view.offsetWidth; view.classList.add('enter');
    const pt = $('#pageTitle'); pt.style.animation = 'none'; void pt.offsetWidth; pt.style.animation = 'rise .5s var(--spring) both';
  }
  state.enter = false;
  countUp();
}

/* Numbers count up once, then ease from old value to new on later changes */
const shownValues = {};
function countUp() {
  $$('[data-count]').forEach(el => {
    const key = el.dataset.key, to = Number(el.dataset.count);
    const from = key in shownValues ? shownValues[key] : 0;
    shownValues[key] = to;
    if (REDUCED || from === to || !window.requestAnimationFrame) { el.textContent = rm(to); return; }
    const start = performance.now(), dur = 900;
    const step = now => {
      const p = Math.min(1, (now - start) / dur), e = 1 - Math.pow(1 - p, 4);
      el.textContent = rm(from + (to - from) * e);
      if (p < 1 && el.isConnected) requestAnimationFrame(step);
    };
    el.textContent = rm(from);
    requestAnimationFrame(step);
  });
}

function barHtml(used, limit, extra = '') {
  const pct = limit > 0 ? Math.min(100, (used / limit) * 100) : (used > 0 ? 100 : 0);
  const cls = extra || (limit > 0 && used > limit ? 'over' : pct >= 80 ? 'warn' : '');
  return `<div class="bar ${cls}"><i style="width:${pct.toFixed(1)}%"></i></div>`;
}
function emptyHtml(icon, text) { return `<div class="glass empty"><span class="app">${icon}</span><p>${text}</p></div>`; }
function secHtml(title, cap = '') { return `<div class="sec"><h2>${title}</h2><span class="cap">${cap}</span></div>`; }

function viewOverview() {
  const t = totals();
  const expenseCats = state.data.categories.filter(c => c.type === 'expense');
  const rows = expenseCats
    .filter(c => (c.active && c.budget > 0) || t.byCat[c.id])
    .map(c => ({ c, used: t.byCat[c.id] || 0 }))
    .sort((a, b) => (b.c.budget ? b.used / b.c.budget : 2) - (a.c.budget ? a.used / a.c.budget : 2));
  const totalBudget = expenseCats.filter(c => c.active).reduce((a, c) => a + c.budget, 0);

  const bills = state.data.recurring.filter(b => b.active);
  const unpaid = bills.filter(b => billStatus(b).key !== 'paid');
  const unpaidSum = unpaid.reduce((a, b) => a + b.amount, 0);
  const anyLate = unpaid.some(b => billStatus(b).key === 'late');

  let html = `
    <section class="glass hero">
      <i class="tab-tl"></i><i class="tab-br"></i><i class="dots"></i>
      <span class="label"><i class="dia"></i>Balance this month</span>
      <b class="hero-num ${t.balance < 0 ? 'neg' : 'mg'}" data-count="${t.balance}" data-key="bal">${rm(t.balance)}</b>
      <p class="hero-sub">${t.income ? 'Income left after spending and savings.' : 'Add your income to see what is left.'}</p>
    </section>
    <div class="stats">
      <div class="glass widget goldw"><span class="label"><i class="dia"></i>Income</span><b data-count="${t.income}" data-key="inc">${rm(t.income)}</b></div>
      <div class="glass widget"><span class="label"><i class="dia"></i>Spent</span><b data-count="${t.spent}" data-key="spt">${rm(t.spent)}</b></div>
      <div class="glass widget"><span class="label"><i class="dia"></i>Saved</span><b data-count="${t.saved}" data-key="svd">${rm(t.saved)}</b></div>
    </div>`;

  if (bills.length) {
    html += `<button class="glass card card-row lift" data-go="bills">
      <span class="app sm">${I.receipt}</span>
      <span class="main"><strong>${unpaid.length ? `${unpaid.length} bill${unpaid.length > 1 ? 's' : ''} still to pay` : 'All bills paid'}</strong>
      <span class="sub">${unpaid.length ? rm(unpaidSum) + ' outstanding' : 'Nothing outstanding this month'}</span></span>
      <span class="pill ${anyLate ? 'late' : unpaid.length ? 'due' : 'paid'}">${anyLate ? 'Overdue' : unpaid.length ? 'Due' : I.check + 'Done'}</span></button>`;
  }

  html += secHtml('Budget', totalBudget ? `${rm(t.spent)} of ${rm(totalBudget)}` : '');
  if (totalBudget) {
    const left = totalBudget - t.spent;
    html += `<div class="glass card"><div class="cat-row" style="padding:0"><div class="top"><strong>${left >= 0 ? 'Left to spend' : 'Over budget'}</strong>
      <span class="amt ${left < 0 ? 'over-text' : 'trail'}" data-count="${Math.abs(left)}" data-key="left">${rm(Math.abs(left))}</span></div>${barHtml(t.spent, totalBudget)}</div></div>`;
  }

  if (!rows.length) {
    html += emptyHtml(I.sliders, 'No budgets set yet. Open <b>Budget</b> and give each category a monthly limit.');
  } else {
    html += `<ul class="glass group plain">` + rows.map(({ c, used }) => {
      const left = c.budget - used;
      const sub = c.budget > 0
        ? (left >= 0 ? `${rm(left)} left of ${rm(c.budget)}` : `<span class="over-text">${rm(-left)} over</span> · budget ${rm(c.budget)}`)
        : 'No budget set';
      return `<li class="cat-row"><div class="top"><strong>${esc(c.name)}</strong><span class="amt">${rm(used)}</span></div>
        <span class="sub">${sub}</span>${barHtml(used, c.budget)}</li>`;

  }
  return html;

function ringHtml(pct) {
  const c = 2 * Math.PI * 26, off = c * (1 - Math.min(1, pct));
  return `<div class="ring"><svg viewBox="0 0 64 64"><circle class="ring-bg" cx="32" cy="32" r="26" fill="none" stroke-width="7"/>
    <circle class="ring-fg" cx="32" cy="32" r="26" fill="none" stroke-width="7" stroke-dasharray="${c.toFixed(2)}" style="stroke-dashoffset:${off.toFixed(2)};--c:${c.toFixed(2)}"/></svg>
    <b>${Math.round(Math.min(1, pct) * 100)}%</b></div>`;
}

function viewGoals() {
  const goals = state.data.goals.filter(g => g.active);
  const totalSaved = goals.reduce((a, g) => a + g.saved, 0);
  let html = '';
  if (goals.length) {
    html += `<section class="glass hero"><i class="tab-tl"></i><i class="tab-br"></i><i class="dots"></i>
      <span class="label"><i class="dia"></i>Saved across goals</span>
      <b class="hero-num mg" data-count="${totalSaved}" data-key="gsav">${rm(totalSaved)}</b>
      <p class="hero-sub">${goals.length} active goal${goals.length > 1 ? 's' : ''}, ${rm(goals.reduce((a, g) => a + Math.max(0, g.target - g.saved), 0))} still to go.</p></section>`;
  } else {
    html += emptyHtml(I.target, 'No goals yet. Add one for a purchase, an emergency fund, or the months you will study without a salary.');
  }
  html += goals.map(g => {
    const left = Math.max(0, g.target - g.saved);
    let pace = '';
    if (g.deadline && left > 0) {
      const months = monthsBetween(thisMonth(), g.deadline);
      pace = months > 0
        ? `${rm(left / months)}/month for ${months} month${months > 1 ? 's' : ''} to hit ${monthName(g.deadline)}`
        : `<span class="over-text">Deadline passed · ${rm(left)} short</span>`;
    }
    return `<div class="glass card lift">
      <div class="goal">${ringHtml(g.target ? g.saved / g.target : 0)}
        <button class="goal-main" data-edit-goal="${esc(g.id)}" style="border:0;background:none;padding:0;text-align:left">
          <strong>${esc(g.name)}</strong><span class="sub">${rm(g.saved)} of ${rm(g.target)}${left === 0 ? ' · reached' : ''}</span></button>
        <button class="chip-btn" data-fund="${esc(g.id)}">Add</button></div>
      ${pace ? `<div class="pace"><i class="dia"></i><span>${pace}</span></div>` : ''}
    </div>`;
  }).join('');
  html += `<button class="btn glassb" data-new-goal>Add a goal</button>`;
  const archived = state.data.goals.filter(g => !g.active);
  if (archived.length) {
    html += `<div><div class="group-h">Archived</div><ul class="glass group plain">` + archived.map(g =>
      `<li><button class="row-btn" data-edit-goal="${esc(g.id)}"><span class="row-main"><strong>${esc(g.name)}</strong></span><span class="amt muted">${rm(g.saved)}</span></button></li>`).join('') + `</ul></div>`;
  }
  return html;
}

/* ---------------- Sheets (forms) ---------------- */
let sheetSeq = 0;
function openSheet(title, body) {
  sheetSeq++;
  const root = $('#sheetRoot');
  root.classList.remove('closing');
  root.innerHTML = `<div class="scrim" data-close></div>
    <form class="sheet" id="sheetForm" novalidate><div class="sheet-head"><div class="grip"></div></div><h3>${esc(title)}</h3>${body}</form>`;
  const form = $('#sheetForm');
  enableSwipe(form);
  $$('.seg', form).forEach(syncSeg);
  const first = $('[autofocus]', form); if (first && FINE) setTimeout(() => first.focus(), 260);
  return form;
}
function closeSheet() {
  const root = $('#sheetRoot');
  if (!root.firstChild) return;
  const my = ++sheetSeq;
  const f = $('#sheetForm'); if (f) f.removeAttribute('id');
  if (REDUCED) { root.innerHTML = ''; return; }
  root.classList.add('closing');
  setTimeout(() => { if (my === sheetSeq) { root.innerHTML = ''; root.classList.remove('closing'); } }, 340);
}
function enableSwipe(sheet) {
  const head = $('.sheet-head', sheet);
  let y0 = null, dy = 0;
  head.addEventListener('pointerdown', e => { y0 = e.clientY; dy = 0; sheet.style.transition = 'none'; try { head.setPointerCapture(e.pointerId); } catch (_) {} });
  head.addEventListener('pointermove', e => { if (y0 === null) return; dy = Math.max(0, e.clientY - y0); sheet.style.transform = `translateY(${dy}px)`; });
  const end = () => { if (y0 === null) return; sheet.style.transition = ''; if (dy > 110) closeSheet(); else sheet.style.transform = ''; y0 = null; };
  head.addEventListener('pointerup', end); head.addEventListener('pointercancel', end);
}
function syncSeg(seg) {
  const btns = $$('button', seg), i = Math.max(0, btns.findIndex(b => b.classList.contains('on')));
  seg.style.setProperty('--n', btns.length); seg.style.setProperty('--idx', i);
}
function segHtml(id, opts, current) {
  return `<div class="seg" id="${id}"><span class="thumb"></span>${opts.map(([k, l]) => `<button type="button" data-type="${k}" class="${current === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
}

async function submit(form, fn, done = 'Saved') {
  const btn = form.querySelector('[type=submit]'); if (btn) btn.disabled = true;
  try { await fn(); closeSheet(); buzz(); toast(done, true); await reload(); }
  catch (e) { handleError(e); }
  finally { if (btn) btn.disabled = false; }
}

function defaultDate() {
  if (state.month === thisMonth()) return todayStr();
  return `${state.month}-${pad(Math.min(new Date().getDate(), daysIn(state.month)))}`;
}

function txForm(existing = {}, preset = {}) {
  const t = { type: 'expense', date: defaultDate(), amount: '', note: '', category: '', goalId: '', recurringId: '', ...preset, ...existing };
  const editing = !!existing.id;
  const form = openSheet(editing ? 'Edit transaction' : preset.recurringId ? 'Pay bill' : 'Add transaction', `
    ${segHtml('typeSeg', [['expense', 'Expense'], ['income', 'Income'], ['saving', 'Saving']], t.type)}
    <div class="field"><label for="f_amount">Amount</label>
      <div class="amount-wrap"><span>RM</span><input id="f_amount" class="amount-input" inputmode="decimal" placeholder="0.00" value="${t.amount || ''}" autofocus></div></div>
    <div class="field"><label for="f_pick" id="pickLabel"></label><select id="f_pick"></select></div>
    <div class="two">
      <div class="field"><label for="f_date">Date</label><input id="f_date" type="date" value="${t.date}"></div>
      <div class="field"><label for="f_note">Note</label><input id="f_note" maxlength="200" placeholder="Optional" value="${esc(t.note)}"></div>
    </div>
    <div class="actions">
      <button class="btn gold" type="submit">${editing ? 'Save changes' : 'Add'}</button>
      ${editing ? `<button class="btn danger" type="button" id="delTx">Delete</button>` : ''}
    </div>`);

  let type = t.type;
  const fillPick = () => {
    const sel = $('#f_pick');
    if (type === 'saving') {
      $('#pickLabel').textContent = 'Goal';
      const goals = state.data.goals.filter(g => g.active || g.id === t.goalId);
      sel.innerHTML = goals.length ? goals.map(g => `<option value="${esc(g.id)}" ${g.id === t.goalId ? 'selected' : ''}>${esc(g.name)}</option>`).join('')
        : `<option value="">Add a goal first (Goals tab)</option>`;
    } else {
      $('#pickLabel').textContent = 'Category';
      const cats = state.data.categories.filter(c => c.type === type && (c.active || c.id === t.category));
      sel.innerHTML = cats.map(c => `<option value="${esc(c.id)}" ${c.id === t.category ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
    }
  };
  fillPick();
  $$('#typeSeg button').forEach(b => b.onclick = () => {
    type = b.dataset.type;

    const record = {
      id: existing.id, type, amount, date: $('#f_date').value, note: $('#f_note').value,
      category: type === 'saving' ? '' : pick, goalId: type === 'saving' ? pick : '',
      recurringId: type === 'expense' ? t.recurringId : '',
    };
    submit(form, () => api('save', { entity: 'Transactions', record }), editing ? 'Updated' : preset.recurringId ? 'Bill paid' : 'Added');
  };
  if (editing) $('#delTx').onclick = () => {
    if (!confirm('Delete this transaction?')) return;
    submit(form, () => api('remove', { entity: 'Transactions', id: existing.id }), 'Deleted');
  };

  if (editing) $('#delBill').onclick = () => {
    if (!confirm('Delete this bill? Past payments stay in your history.')) return;
    submit(form, () => api('remove', { entity: 'Recurring', id: existing.id }), 'Deleted');
  };
}

/* ---------------- Events ---------------- */
function goMonth(by) {
  state.month = by === 0 ? thisMonth() : shiftMonth(state.month, by);
  const lbl = $('#monthLabel');
  lbl.classList.remove('swap-l', 'swap-r'); void lbl.offsetWidth; lbl.classList.add(by < 0 ? 'swap-l' : 'swap-r');
  render(); reload(true);
}
function goTab(tab) {
  if (tab === state.tab) return;
  state.tab = tab; state.enter = true; render(); window.scrollTo(0, 0);
}
$('#lockForm').onsubmit = e => { e.preventDefault(); const p = $('#pinInput').value.trim(); if (p) unlock(p, $('#remember').checked); };
$('#prevMonth').onclick = () => goMonth(-1);
$('#nextMonth').onclick = () => goMonth(1);
$('#monthLabel').onclick = () => { if (state.month !== thisMonth()) goMonth(0); };
$('#refresh').onclick = () => { const r = $('#refresh'); r.classList.remove('spin'); void r.offsetWidth; r.classList.add('spin'); reload(); };
$('#fab').onclick = () => { buzz(); txForm(); };
$$('nav.tabs button').forEach(b => b.onclick = () => goTab(b.dataset.tab));

document.addEventListener('click', e => {
  const el = e.target.closest('[data-close],[data-go],[data-edit-tx],[data-edit-bill],[data-pay],[data-new-bill],[data-edit-goal],[data-fund],[data-new-goal],[data-edit-cat],[data-new-cat],[data-lock],[data-reset-demo]');
  if (!el) return;
  const d = el.dataset;
  if ('close' in d) closeSheet();
  else if (d.go) goTab(d.go);
  else if (d.editTx) txForm(state.data.transactions.find(t => t.id === d.editTx));
  else if (d.editBill) billForm(state.data.recurring.find(b => b.id === d.editBill));
  else if (d.pay) { const b = state.data.recurring.find(x => x.id === d.pay); txForm({}, { type: 'expense', amount: b.amount, category: b.category, recurringId: b.id, note: b.name, date: state.month === thisMonth() ? todayStr() : `${state.month}-${pad(Math.min(b.day, daysIn(state.month)))}` }); }
  else if ('newBill' in d) billForm();
  else if (d.editGoal) goalForm(state.data.goals.find(g => g.id === d.editGoal));
  else if (d.fund) txForm({}, { type: 'saving', goalId: d.fund });
  else if ('newGoal' in d) goalForm();
  else if (d.editCat) catForm(state.data.categories.find(c => c.id === d.editCat));
  else if ('newCat' in d) catForm();
  else if ('lock' in d) { store('bt_pin', null); lock(); }
  else if ('resetDemo' in d) { if (confirm('Clear all demo data?')) { store('bt_demo', null); demoMemory = null; reload(true); toast('Cleared', true); } }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* Cursor glow + glass highlight (mouse and trackpad only) */
if (FINE && !REDUCED) {
  document.documentElement.classList.add('fine');
  const glow = $('#glow');
  let tx = innerWidth / 2, ty = innerHeight / 3, gx = tx, gy = ty, running = false;
  const loop = () => {
    gx += (tx - gx) * 0.12; gy += (ty - gy) * 0.12;
    glow.style.transform = `translate3d(${gx}px, ${gy}px, 0)`;
    if (Math.abs(tx - gx) + Math.abs(ty - gy) > 0.5) requestAnimationFrame(loop); else running = false;
  };
  document.addEventListener('pointermove', e => {
    tx = e.clientX; ty = e.clientY; glow.classList.add('on');
    if (!running) { running = true; requestAnimationFrame(loop); }
    const card = e.target.closest && e.target.closest('.glass');
    if (card) { const r = card.getBoundingClientRect(); card.style.setProperty('--mx', (e.clientX - r.left) + 'px'); card.style.setProperty('--my', (e.clientY - r.top) + 'px'); }
  }, { passive: true });
  document.addEventListener('pointerleave', () => glow.classList.remove('on'));
}

/* ---------------- Start ---------------- */
const saved = recall('bt_pin');
// With a saved PIN, use it. Without one, try opening with no PIN (works in demo or server test mode);
// if the server wants a PIN, the lock screen appears.
if (saved) unlock(saved, true); else unlock('', false, true);
</script>
